name: Deploy Maler Prasch (TinaCMS) to Netcup

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        tenant: [maler_prasch]

    steps:
      # 1. Repository auschecken
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Node.js Umgebung einrichten
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Abhängigkeiten installieren
      - name: Install Dependencies
        run: npm ci

      # 4. Statischen Build ausführen (Next.js / Astro / Vite)
      - name: Build Site for ${{ matrix.tenant }}
        env:
          TENANT_ID: ${{ matrix.tenant }}
          NEXT_PUBLIC_TINA_BRANCH: 'main'
          NEXT_PUBLIC_TINA_CLIENT_ID: ${{ secrets[format('TINA_CLIENT_ID_{0}', matrix.tenant)] }}
          TINA_TOKEN: ${{ secrets[format('TINA_TOKEN_{0}', matrix.tenant)] }}
        run: npm run build

      # 5. Gebaute Dateien auf Netcup hochladen
      - name: Deploy to Netcup Webhosting
        uses: SamKirsch/ftp-deploy-action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: /maler-prasch.at/httpdocs/
          dangerous-clean-slate: false
